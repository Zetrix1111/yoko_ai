<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FDFBF7" />
  <link rel="manifest" href="/manifest.json" />
  <title>Yoko AI</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/sw.js', { updateViaCache: 'none' })
          .then((reg) => {
            // Revisa si hay una versión nueva en cada carga
            reg.update();
            // Cuando un SW nuevo tome control, recarga para que se vean los cambios
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (reloaded) return;
              reloaded = true;
              location.reload();
            });
          });
      });
    }
  </script>
</head>

<body>
  <div id="splash-screen">
    <div class="splash-content">
      <img src="/logo-pwa-512.png" alt="Yoko" class="splash-logo" />
      <div class="splash-loader"></div>
    </div>
  </div>
  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #FDFBF7;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      animation: splash-in 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .splash-logo {
      width: 120px;
      height: 120px;
      border-radius: 32px;
      box-shadow: 0 10px 30px rgba(197, 115, 122, 0.15);
    }
    .splash-loader {
      width: 40px;
      height: 4px;
      background: rgba(197, 115, 122, 0.1);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .splash-loader::after {
      content: '';
      position: absolute;
      left: -50%;
      width: 50%;
      height: 100%;
      background: #C5737A;
      animation: splash-loading 1.5s infinite ease-in-out;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes splash-loading {
      0% { left: -50%; }
      100% { left: 100%; }
    }
    .splash-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    window.addEventListener('load', () => {
      const splash = document.getElementById('splash-screen');
      setTimeout(() => {
        splash.classList.add('splash-hidden');
      }, 800);
    });
  </script>
</body>

</html>
